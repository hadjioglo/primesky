les:\r\n      | device_type | viewport_size |\r\n      | Desktop     | 1920x1080    |\r\n      | Tablet      | 768x1024     |\r\n      | Mobile      | 375x667      |\r\n\r\n  @performance @medium-priority\r\n  Scenario: Verify page performance metrics\r\n    When I navigate to the homepage\r\n    Then the page should load within 3 seconds\r\n    And all images should load properly\r\n    And the page should be interactive within 5 seconds\r\n    And there should be no console errors\r\n\r\n  @accessibility @medium-priority\r\n  Scenario: Verify basic accessibility compliance\r\n    When I navigate to the homepage\r\n    Then all images should have alt text\r\n    And form elements should have proper labels\r\n    And the page should be navigable using keyboard only\r\n    And color contrast should meet WCAG guidelines","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"classpath:features/core_functionality.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@smoke","id":"dbdb4815-6ae6-4b06-867f-326149a46b9d"},{"location":{"line":1,"column":8},"name":"@critical-path","id":"39a2f0ca-09f7-4802-8247-22b40c7fbb7b"}],"language":"en","keyword":"Feature","name":"PrimeSky Website Core Functionality","description":"  As a user of the PrimeSky website\n  I want to access and navigate the core features\n  So that I can accomplish my intended tasks","children":[{"background":{"location":{"line":7,"column":3},"keyword":"Background","name":"","description":"","steps":[{"location":{"line":8,"column":5},"keyword":"Given ","keywordType":"Context","text":"I am on the PrimeSky homepage","id":"c48d1dd1-15ab-407e-ab32-3c1c20658b30"}],"id":"f6d16f2e-02d8-480b-9f27-3702cf5c7066"}},{"scenario":{"location":{"line":11,"column":3},"tags":[{"location":{"line":10,"column":3},"name":"@page-load","id":"d9515957-e60b-4abf-94e9-d1d2f29faa04"},{"location":{"line":10,"column":14},"name":"@high-priority","id":"08512433-2472-456c-b
